# Use the same settings for the quantized control. The player flag selects Gaussian.
server::synch_mode = true
server::fullstate_l = true
server::fullstate_r = true
server::full_view = true
server::see_no_fade_unum = true
server::see_no_fade_all = false
server::see_no_quantization = false
server::see_noise_free = false
server::say_msg_size = 0

# Match the command processing used in the original Exp3 baseline.
server::randomize_player_commands = false
server::command_order_log = false

# Standard Gaussian distance and focus-distance rates.
server::dist_noise_rate = 0.0125
server::focus_dist_noise_rate = 0.0125
server::land_dist_noise_rate = 0.00125
server::land_focus_dist_noise_rate = 0.00125
